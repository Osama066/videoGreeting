services:
  # -----------------------------------------------------------
  # 1. Backend Web Service (Node.js Express API)
  # -----------------------------------------------------------
  - type: web
    name: video-greeting-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard (MongoDB Atlas URI)
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: dfyrmbgia
      - key: CLOUDINARY_UPLOAD_PRESET
        value: voicegreeting
      - key: CLOUDINARY_FOLDER
        value: voice
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MODAL_WAV2LIP_ENDPOINT
        sync: false

  # -----------------------------------------------------------
  # 2. Frontend Static Site (React + Vite SPA)
  # -----------------------------------------------------------
  - type: web
    name: video-greeting-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Proxy /api calls to your backend Web Service
      - type: rewrite
        source: /api/*
        destination: https://video-greeting-api.onrender.com/api/*
      # Support React Router client-side routing (SPA fallback)
      - type: rewrite
        source: /*
        destination: /index.html
